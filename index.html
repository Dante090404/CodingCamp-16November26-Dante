<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">

    <!-- ===== Header: Greeting & Clock ===== -->
    <header class="site-header">
      <div class="header-clock">
        <h1 id="clock">00:00:00</h1>
        <p id="date">Monday, January 1, 2025</p>
      </div>
      <div class="header-greeting">
        <p id="greeting">Good morning!</p>
        <button id="edit-name" type="button">Change name</button>
      </div>
      <div class="header-actions">
        <button id="theme-toggle" type="button">Dark mode</button>
      </div>
    </header>

    <!-- ===== Main grid ===== -->
    <main class="grid">

      <!-- Focus Timer card -->
      <section class="card" aria-labelledby="timer-heading">
        <h2 id="timer-heading">Focus Timer</h2>
        <div id="timer-display" class="timer-display" aria-live="polite" aria-atomic="true">25:00</div>
        <div class="row">
          <label for="timer-minutes">Minutes</label>
          <input id="timer-minutes" type="number" min="1" max="120" value="25" aria-label="Session length in minutes" />
        </div>
        <div class="row">
          <button id="timer-start" type="button">Start</button>
          <button id="timer-stop" type="button">Stop</button>
          <button id="timer-reset" type="button">Reset</button>
        </div>
      </section>

      <!-- To-Do List card -->
      <section class="card" aria-labelledby="todo-heading">
        <h2 id="todo-heading">To-Do List</h2>

        <form id="todo-form" novalidate>
          <div class="row">
            <input
              id="todo-input"
              type="text"
              placeholder="Add a task…"
              maxlength="200"
              required
              aria-label="New task text"
              aria-describedby="todo-error"
            />
            <button type="submit">Add</button>
          </div>
          <p id="todo-error" class="error-msg" aria-live="polite" role="alert"></p>
        </form>

        <div class="row sort-row">
          <label for="todo-sort">Sort:</label>
          <select id="todo-sort" aria-label="Sort tasks">
            <option value="newest">Newest first</option>
            <option value="oldest">Oldest first</option>
            <option value="az">A → Z</option>
            <option value="za">Z → A</option>
            <option value="pending">Pending first</option>
            <option value="done">Done first</option>
          </select>
          <span id="todo-count" class="muted-text" aria-live="polite"></span>
        </div>

        <ul id="todo-list" class="todo-list" aria-label="Task list"></ul>
      </section>

      <!-- Quick Links card (wide) -->
      <section class="card wide" aria-labelledby="links-heading">
        <h2 id="links-heading">Quick Links</h2>

        <form id="link-form" novalidate>
          <div class="row">
            <input
              id="link-name"
              type="text"
              placeholder="Name"
              maxlength="50"
              required
              aria-label="Link name"
              aria-describedby="link-error"
            />
            <input
              id="link-url"
              type="text"
              placeholder="URL (e.g. example.com)"
              maxlength="2000"
              required
              aria-label="Link URL"
              aria-describedby="link-error"
            />
            <button type="submit">Add link</button>
          </div>
          <p id="link-error" class="error-msg" aria-live="polite" role="alert"></p>
        </form>

        <div id="links" class="links-grid" aria-label="Saved links"></div>
      </section>

    </main>
  </div>

  <script src="js/script.js" defer></script>
</body>
</html>
